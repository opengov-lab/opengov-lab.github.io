# Custom social card layout for OpenGov Lab
# Matching the site's cyan/red color scheme with Geist fonts
# Supports background images via page.meta.image frontmatter

# Definitions for meta tags
definitions:
  - &page_title_with_site_name >-
    {%- if not page.is_homepage -%}
      {{ page.meta.get("title", page.title) }} - {{ config.site_name }}
    {%- else -%}
      {{ config.site_name }}
    {%- endif -%}

  - &page_description >-
    {{ page.meta.get("description", config.site_description) | default("Research at the intersection of AI and open government", true) }}

# Meta tags for social sharing (Open Graph + Twitter Cards)
tags:
  og:type: website
  og:title: *page_title_with_site_name
  og:description: *page_description
  og:image: "{{ image.url }}"
  og:image:type: "{{ image.type }}"
  og:image:width: "{{ image.width }}"
  og:image:height: "{{ image.height }}"
  og:url: "{{ page.canonical_url }}"

  twitter:card: summary_large_image
  twitter:title: *page_title_with_site_name
  twitter:description: *page_description
  twitter:image: "{{ image.url }}"

size: { width: 1200, height: 630 }

layers:
  # Background - cyan base color
  - background:
      color: "#c7fafb"

  # Background image from page frontmatter (if available)
  # Image path is constructed from: docs/<page directory>/<image filename>
  - background:
      image: "{{ ('docs/' ~ '/'.join(page.file.src_path.split('/')[:-1]) ~ '/' ~ page.meta.image) if page.meta.image else '' }}"

  # Semi-transparent overlay for readability when image is present
  # dd = 87% opacity, cc = 80%, bb = 73%, aa = 67%, 99 = 60%, 88 = 53%
  - background:
      color: "{{ '#c7fafbcc' if page.meta.image else '#c7fafb00' }}"

  # OpenGov icon/logo - top left
  - size: { width: 100, height: 100 }
    offset: { x: 60, y: 50 }
    icon:
      value: opengov
      color: "#ff2903"

  # Page title - main content
  - size: { width: 1080, height: 200 }
    offset: { x: 60, y: 170 }
    typography:
      content: "{{ page.title }}"
      align: start
      color: "#380504"
      line:
        amount: 2
        height: 1.15
      font:
        family: Geist
        style: Bold

  # Page description - below title
  - size: { width: 1080, height: 120 }
    offset: { x: 60, y: 380 }
    typography:
      content: "{{ page.meta.get('description', config.site_description) | default('Research at the intersection of AI and open government', true) }}"
      align: start
      color: "#380504"
      line:
        amount: 3
        height: 1.3
      font:
        family: Geist
        style: Regular

  # Site name at bottom left
  - size: { width: 500, height: 40 }
    offset: { x: 60, y: 540 }
    typography:
      content: ICAI OpenGov Lab
      align: start
      color: "#ff2903"
      font:
        family: Geist
        style: SemiBold

  # URL at bottom right
  - size: { width: 300, height: 40 }
    offset: { x: 840, y: 540 }
    typography:
      content: opengov.nl
      align: end
      color: "#380504"
      font:
        family: Geist Mono
        style: Medium
